name: Apply expanded ReguPulse source
on:
  push:
    branches: [main]
    paths:
      - ".sync/source-part-*"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete project tree
        run: |
          set -euo pipefail
          cat .sync/source-part-* | base64 --decode > /tmp/regupulse-source.tar.xz
          xz --test /tmp/regupulse-source.tar.xz
          mkdir -p /tmp/regupulse-expanded
          tar -xJf /tmp/regupulse-source.tar.xz -C /tmp/regupulse-expanded
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .sync ! -name .github -exec rm -rf {} +
          cp -a /tmp/regupulse-expanded/. .
          rm -rf .sync
          rm -f .github/workflows/apply-expanded-source.yml .github/workflows/restore-source.yml
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified source to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No source changes to commit"; exit 0; }
          git commit -m "Expand ReguPulse compliance workbench"
          git push origin HEAD:main
