name: Restore ReguPulse source and verify

on:
  push:
    branches: [main]
    paths:
      - ".sync/regupulse-source.tar.gz.b64"

permissions:
  contents: write

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore full project source
        run: |
          python3 - <<'PY'
          import base64, os, shutil, tarfile
          archive_b64 = ".sync/regupulse-source.tar.gz.b64"
          with open(archive_b64, "rb") as f:
              archive = base64.b64decode(f.read())
          with open("/tmp/regupulse-source.tar.gz", "wb") as f:
              f.write(archive)
          for name in os.listdir("."):
              if name not in {".git", ".sync"}:
                  if os.path.isdir(name):
                      shutil.rmtree(name)
                  else:
                      os.remove(name)
          with tarfile.open("/tmp/regupulse-source.tar.gz", "r:gz") as tf:
              tf.extractall(".", filter="data")
          shutil.rmtree(".sync", ignore_errors=True)
          if os.path.exists(".github/workflows/restore-source.yml"):
              os.remove(".github/workflows/restore-source.yml")
          PY
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build production app
        run: npm run build
      - name: Commit verified full-stack source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore full-stack ReguPulse product and verify build"
          git push origin HEAD:main
