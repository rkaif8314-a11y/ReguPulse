<body class="min-h-screen antialiased selection:bg-slate-900 selection:text-white">

        <span class="flex h-7 w-7 items-center justify-center rounded bg-slate-900 text-white">
          <i data-lucide="shield-check" class="h-4 w-4"></i>
        </span>
        <span class="text-sm font-semibold tracking-tight text-slate-900">ReguPulse</span>

      <nav class="flex items-center gap-1 overflow-x-auto">
        <button data-view="landing" class="nav-tab rounded-md px-3 py-1.5 text-xs font-medium transition-colors">Scanner</button>
        <button data-view="report" class="nav-tab rounded-md px-3 py-1.5 text-xs font-medium transition-colors">Audit Dossier</button>

      </nav>
    </div>
  </header>

  <main id="app-root" class="pb-20"></main>

  <!-- Checkout Modal -->
  <div id="modal-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/40 p-4 backdrop-blur-[2px]">
    <div class="w-full max-w-md rounded-xl border border-stone-300 bg-white p-6 shadow-xl">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p id="modal-subtitle" class="font-mono-code text-[11px] uppercase tracking-wider text-stone-500">Checkout</p>
          <h3 id="modal-title" class="mt-1 text-base font-semibold text-slate-900">Unlock Dossier</h3>
        </div>
        <button id="modal-close" type="button" class="rounded p-1 text-stone-400 hover:bg-stone-100 hover:text-slate-900">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>
      <div id="modal-body" class="mt-4 text-sm text-stone-600"></div>
      <div class="mt-6 flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button id="modal-cancel" type="button" class="rounded-md border border-stone-300 bg-white px-3.5 py-2 text-xs font-medium text-slate-700 hover:bg-stone-50">Cancel</button>

      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed bottom-5 right-5 z-50 hidden rounded-lg border border-slate-800 bg-slate-900 px-4 py-2.5 text-xs font-medium text-white shadow-lg"></div>

  <script>
    (function () {
      const SCAN_PROFILES = {

          risk_level: "HIGH",
          tech: ["Intercom", "Google Analytics / GTM", "Meta Pixel", "Next.js"],

            {

          chatbot_widget: '<div id="rp-ai-badge" role="region" aria-label="AI Assistant Disclosure" style="position:fixed;bottom:84px;right:20px;background:#111827;color:#F8FAFC;padding:10px 14px;border-radius:8px;border:1px solid #334155;font-size:12px;z-index:9999;">\n  Automated AI Assistant (Intercom). <a href="/contact" style="color:#93C5FD;text-decoration:underline;margin-left:6px;">Talk to a human</a>\n</div>',

          issues: [

              points_deducted: 12,
              description: "Found 3 icon-only <button> elements with no accessible name.",
              snippets: ['<button class="cart-icon-btn"><svg viewBox="0 0 24 24"></svg></button>'],
              patch: '<button class="cart-icon-btn" aria-label="Open shopping cart"><svg aria-hidden="true" viewBox="0 0 24 24"></svg></button>',

            }
          ],
          chatbot_widget: '<div role="status" style="padding:8px 12px;background:#111827;color:#fff;border-radius:6px;font-size:12px;">Tidio AI Shopping Assistant — <a href="/support" style="color:#93C5FD;">Speak with human support</a></div>',

        },
        "compliant-bank.org": {
          domain: "compliant-bank.org",
          url: "https://compliant-bank.org",
          overall_score: 96,
          ai_act_score: 100,
          accessibility_score: 96,
          privacy_score: 92,
          risk_level: "LOW",
          tech: ["OneTrust", "Next.js"],
          issues: [
            {
              rule_id: "ACC-13",
              pillar: "ACCESSIBILITY",
              severity: "LOW",
              title: "Missing Skip-to-Main-Content Navigation Link",
              legal_reference: "WCAG 2.2 SC 2.4.1 (Level A)",

      const state = {

        currency: "USD",
        isScanning: false,
        scanStep: 0,
        activePillar: "ALL",
        unlockedScans: { "compliant-bank.org": true },
        currentScan: SCAN_PROFILES["saas-chatbot-demo.io"],
        monitoredSites: [
          { id: "s1", domain: "saas-chatbot-demo.io", url: "https://saas-chatbot-demo.io", slug: "saas-chatbot-demo-io-8f2a", score: 54, monitoring: true, verified: false, lastScanned: "Today, 11:30 PM" },
          { id: "s2", domain: "compliant-bank.org", url: "https://compliant-bank.org", slug: "compliant-bank-org-4c1d", score: 96, monitoring: true, verified: true, lastScanned: "Today, 09:15 AM" }
        ],
        verifySlug: "compliant-bank-org-4c1d"
      };

      let scanTimer = null;

      function showToast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.remove("hidden");
        setTimeout(() => el.classList.add("hidden"), 2400);
      }

      function copyClipboard(text, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(label)).catch(() => fallbackCopy(text, label));
        } else {
          fallbackCopy(text, label);
        }
      }

      function fallbackCopy(text, label) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); showToast(label); } catch (_) {}
        document.body.removeChild(ta);
      }

      function openModal({ title, subtitle, bodyHtml, onConfirm }) {
        const overlay = document.getElementById("modal-overlay");
        document.getElementById("modal-title").textContent = title;
        document.getElementById("modal-subtitle").textContent = subtitle;
        document.getElementById("modal-body").innerHTML = bodyHtml;
        overlay.classList.remove("hidden");
        overlay.classList.add("flex");

        const close = () => {
          overlay.classList.add("hidden");
          overlay.classList.remove("flex");
        };
        document.getElementById("modal-close").onclick = close;
        document.getElementById("modal-cancel").onclick = close;
        document.getElementById("modal-confirm").onclick = () => {
          onConfirm();
          close();
        };
      }

      function runScan(rawUrl) {
        const cleaned = rawUrl.trim().replace(/^https?:\/\//i, "").replace(/\/.*$/, "").toLowerCase();
        if (!cleaned || !cleaned.includes(".")) {
          showToast("Enter a valid domain such as example.com");
          return;
        }
        if (scanTimer) clearInterval(scanTimer);
        state.isScanning = true;
        state.scanStep = 0;
        render();

        scanTimer = setInterval(() => {
          state.scanStep += 1;
          if (state.scanStep >= 4) {
            clearInterval(scanTimer);
            scanTimer = null;
            state.isScanning = false;
            state.currentScan = SCAN_PROFILES[cleaned]
              ? SCAN_PROFILES[cleaned]
              : { ...SCAN_PROFILES["saas-chatbot-demo.io"], domain: cleaned, url: "https://" + cleaned };
            state.view = "report";
          }
          render();
        }, 500);
      }

      function severityPill(sev) {
        if (sev === "CRITICAL") return "border-red-200 bg-red-50 text-red-700";
        if (sev === "HIGH") return "border-orange-200 bg-orange-50 text-orange-700";
        if (sev === "MODERATE") return "border-amber-200 bg-amber-50 text-amber-700";
        return "border-sky-200 bg-sky-50 text-sky-700";
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

        return `

            <div class="mx-auto max-w-4xl">
              <div class="inline-flex items-center gap-2 rounded-full border border-stone-200 bg-stone-50 px-3 py-1 text-xs font-medium text-stone-700">

                </div>
                <button type="submit" ${state.isScanning ? "disabled" : ""} class="inline-flex h-10 items-center justify-center rounded-lg bg-slate-900 px-5 text-xs font-semibold text-white transition-colors hover:bg-slate-800 disabled:opacity-60">

            </div>
          </section>

          <!-- Three Pillars Specification Grid -->
          <section class="mx-auto max-w-6xl px-4 py-12 sm:px-6">
            <div class="grid gap-px overflow-hidden rounded-xl border border-stone-200 bg-stone-200 md:grid-cols-3">
              <div class="bg-white p-6">

      function bindEvents() {
        document.getElementById("nav-logo").onclick = () => { state.view = "landing"; render(); };

        document.querySelectorAll(".nav-tab, .nav-jump").forEach((btn) => {
          btn.onclick = () => {
            state.view = btn.getAttribute("data-view");
            render();
          };
        });

        const scanForm = document.getElementById("scan-form");
        if (scanForm) {
          scanForm.onsubmit = (e) => {
            e.preventDefault();
            const val = document.getElementById("scan-url-input").value || "saas-chatbot-demo.io";
            runScan(val);
          };
        }

        document.querySelectorAll(".sample-btn").forEach((btn) => {
          btn.onclick = () => runScan(btn.getAttribute("data-sample"));
        });

        document.querySelectorAll(".currency-btn").forEach((btn) => {
          btn.onclick = () => {
            state.currency = btn.getAttribute("data-currency");
            render();
          };
        });

        const shareBtn = document.getElementById("btn-share-report");
        if (shareBtn) {
          shareBtn.onclick = () => copyClipboard(`https://regupulse.ai/report/${state.currentScan.domain}`, "Shareable report URL copied");
        }

        const printBtn = document.getElementById("btn-print-pdf");
        if (printBtn) {
          printBtn.onclick = () => window.print();
        }

        const dlMdBtn = document.getElementById("btn-download-md");
        if (dlMdBtn) {
          dlMdBtn.onclick = () => {
            const blob = new Blob([state.currentScan.legal_md], { type: "text/markdown;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${state.currentScan.domain}-ai-privacy-addendum.md`;
            a.click();
            URL.revokeObjectURL(url);
          };
        }

        const stripeBtn = document.getElementById("btn-pay-stripe");
        if (stripeBtn) {
          stripeBtn.onclick = () => openModal({
            title: "Stripe Checkout (USD)",
            subtitle: `Single-Site Unlock • ${state.currentScan.domain}`,
            bodyHtml: `<p>Total: <strong class="text-slate-900">$29.00 USD</strong> (one-time)</p><p class="mt-2 text-xs text-stone-500">Unlocks all DOM snippets, copy-paste code diffs, and legal addendum.</p>`,
            onConfirm: () => {
              state.unlockedScans[state.currentScan.domain] = true;
              showToast("Dossier unlocked via Stripe");
              render();
            }
          });
        }

        const rzpBtn = document.getElementById("btn-pay-razorpay");
        if (rzpBtn) {
          rzpBtn.onclick = () => openModal({
            title: "Razorpay UPI / Card (INR)",
            subtitle: `Single-Site Unlock • ${state.currentScan.domain}`,
            bodyHtml: `<p>Total: <strong class="text-slate-900">₹2,499 INR</strong></p><p class="mt-2 text-xs text-stone-500">Unlocks all DOM snippets, copy-paste code diffs, and legal addendum.</p>`,
            onConfirm: () => {
              state.unlockedScans[state.currentScan.domain] = true;
              showToast("Dossier unlocked via Razorpay");
              render();
            }
          });
        }

        document.querySelectorAll(".pillar-btn").forEach((btn) => {
          btn.onclick = () => {
            state.activePillar = btn.getAttribute("data-pillar");
            render();
          };
        });

        document.querySelectorAll(".copy-patch-btn").forEach((btn) => {
          btn.onclick = () => {
            const ruleId = btn.getAttribute("data-copy-rule");
            const issue = state.currentScan.issues.find((i) => i.rule_id === ruleId);
            if (issue) copyClipboard(issue.patch, `Copied ${ruleId} patch`);
          };
        });

        const copyWidgetBtn = document.getElementById("btn-copy-widget");
        if (copyWidgetBtn) {
          copyWidgetBtn.onclick = () => copyClipboard(state.currentScan.chatbot_widget, "Copied chatbot widget snippet");
        }

        const addSiteForm = document.getElementById("add-site-form");
        if (addSiteForm) {
          addSiteForm.onsubmit = (e) => {
            e.preventDefault();
            const raw = document.getElementById("add-site-input").value.trim().replace(/^https?:\/\//i, "").replace(/\/.*$/, "").toLowerCase();
            if (!raw || !raw.includes(".")) {
              showToast("Enter a valid domain");
              return;
            }
            if (state.monitoredSites.length >= 3) {
              showToast("Pro Guard limit (3 sites) reached");
              return;
            }
            state.monitoredSites.unshift({
              id: "s" + Date.now(),
              domain: raw,
              url: "https://" + raw,
              slug: raw.replace(/[^a-z0-9]+/g, "-") + "-9a1c",
              score: 84,
              monitoring: true,
              verified: true,
              lastScanned: "Just now"
            });
            showToast(`Added ${raw}`);
            render();
          };
        }

        document.querySelectorAll(".toggle-site-btn").forEach((btn) => {
          btn.onclick = () => {
            const id = btn.getAttribute("data-toggle-site");
            const site = state.monitoredSites.find((s) => s.id === id);
            if (site) {
              site.monitoring = !site.monitoring;
              render();
            }
          };
        });

        document.querySelectorAll(".copy-badge-btn").forEach((btn) => {
          btn.onclick = () => {
            const slug = btn.getAttribute("data-copy-badge");
            copyClipboard(`<a href="https://regupulse.ai/verify/${slug}" target="_blank" rel="noopener noreferrer"><img src="https://regupulse.ai/api/badge/${slug}" alt="Verified Compliant by ReguPulse" /></a>`, "Copied Trust Badge embed HTML");
          };
        });

        document.querySelectorAll(".open-verify-btn").forEach((btn) => {
          btn.onclick = () => {
            state.verifySlug = btn.getAttribute("data-verify-slug");
            state.view = "verify";
            render();
          };
        });

        document.querySelectorAll(".delete-site-btn").forEach((btn) => {
          btn.onclick = () => {
            const id = btn.getAttribute("data-delete-site");
            state.monitoredSites = state.monitoredSites.filter((s) => s.id !== id);
            render();
          };
        });
      }

      function render() {
        document.querySelectorAll(".nav-tab").forEach((tab) => {
          const active = tab.getAttribute("data-view") === state.view;
          tab.className = `nav-tab rounded-md px-3 py-1.5 text-xs font-medium transition-colors ${
            active ? "bg-slate-900 text-white" : "text-stone-600 hover:bg-stone-200/70 hover:text-slate-900"
          }`;
        });

        const root = document.getElementById("app-root");
        if (state.view === "landing") root.innerHTML = renderLanding();
        else if (state.view === "report") root.innerHTML = renderReport();
        else if (state.view === "dashboard") root.innerHTML = renderDashboard();
        else root.innerHTML = renderVerify();

        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }
        bindEvents();
      }

      render();
    })();
  </script>
</body>
</html>
